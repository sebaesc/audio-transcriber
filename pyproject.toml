[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-transcriber"
version = "0.1.0"
description = "A modular audio transcription pipeline with swappable model backends."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Core dependencies are the pipeline and its CLI only. Transcription engines are
# optional extras below: installing the pipeline must never pull in every engine.
dependencies = [
    "typer>=0.12,<0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<0.15",
]

# One extra per backend. Adding a backend adds an entry here and nothing else.
faster-whisper = [
    "faster-whisper>=1.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_transcriber"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"] # line length is handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["audio_transcriber"]
